plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.sipandsavour'
    compileSdk 36

    defaultConfig {
        applicationId "com.sipandsavour"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            buildConfigField "String", "BASE_URL", "\"http://10.0.2.2:8000/\""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", "\"https://api.sipandsavour.com/\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true // INDISPENSABLE pour Robolectric
        }
    }
}

dependencies {

    // --- Android Core ---
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // --- Material Design ---
    implementation 'com.google.android.material:material:1.13.0'

    // --- Navigation Component ---
    implementation 'androidx.navigation:navigation-fragment:2.9.7'
    implementation 'androidx.navigation:navigation-ui:2.9.7'

    // --- Lifecycle (ViewModel + LiveData) ---
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.10.0'

    // --- DataStore ---
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    // --- WorkManager ---
    implementation 'androidx.work:work-runtime:2.11.1'

    // --- Retrofit + OkHttp ---
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // --- Gson ---
    implementation 'com.google.code.gson:gson:2.13.2'

    // --- Hilt (2.59.2 requis pour AGP 9.x) ---
    implementation 'com.google.dagger:hilt-android:2.59.2'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.59.2'
    implementation 'androidx.hilt:hilt-work:1.3.0'
    annotationProcessor 'androidx.hilt:hilt-compiler:1.3.0'

    // --- Glide ---
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // --- Lottie ---
    implementation 'com.airbnb.android:lottie:6.7.1'

    // --- Splash Screen API ---
    implementation 'androidx.core:core-splashscreen:1.2.0'

    // --- Swipe Refresh ---
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'

    // --- ViewPager2 ---
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'com.google.mlkit:translate:17.0.2'

    // --- Tests ---
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.robolectric:robolectric:4.12'
    debugImplementation 'androidx.fragment:fragment-testing:1.6.2'
    testImplementation 'androidx.navigation:navigation-testing:2.7.7'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}