name: "Android CI - Sip&Savour"

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configuration de Java 17
      # Android moderne nécessite souvent Java 17 (pour AGP 8+)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Active le cache Gradle pour accélérer les builds

      # 3. Permission d'exécution pour Gradle Wrapper
      # Indispensable sur Linux/Mac pour utiliser ./gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Compilation de l'APK (Debug)
      # Vérifie que le code compile correctement sans erreur
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 5. Lancement des Tests Unitaires
      # Lance les tests situés dans app/src/test/java (ExampleUnitTest.java)
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
