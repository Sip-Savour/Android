name: "Android CI - Sip&Savour"

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # NOUVEAU : L'action officielle Gradle (bien plus performante pour le cache)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # BONUS 1 : Vérification de la qualité du code (Lint)
      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # BONUS 2 : Met l'APK à disposition sur GitHub !
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SipAndSavour-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
